/* LOGIN */

.logo {

  color: #f5c542;

  line-height: 1.25;

.login-box h2 {

  font-size: 14px;
  color: #aaa;

}

.login-box input {

  margin-top: 25px;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #555;
  background: #080808;
  color: white;
  outline: none;
  text-align: center;
  font-size: 16px;
}

}

/* APP */

header {

  z-index: 10;
}

.header-title {
  text-align: center;
}

.header-title h1 {
  color: #f5c542;
  font-size: 20px;
  line-height: 1.25;
}

.header-title p {
  color: #aaa;
  margin-top: 5px;
  font-size: 12px;

.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 18px 14px 40px;
}

.info {
  background: rgba(20, 23, 24, .9);
  border: 1px solid #383838;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 15px;
}

.info strong {
  color: #f5c542;
}

.search {
  width: 100%;
  padding: 15px;
  border-radius: 13px;
  border: 1px solid #444;
  background: #0b0c0d;
  color: white;
  font-size: 16px;
  outline: none;
  margin-bottom: 15px;
}

.search:focus {
  border-color: #d4af37;
}

.macro {
  background: linear-gradient(145deg, #151819, #0d0f10);
  border: 1px solid #303334;
  border-radius: 17px;
  margin-bottom: 12px;
  padding: 15px;
}

.macro-number {
  color: #d4af37;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 8px;
}

.macro-text {
  color: #eee;
  white-space: pre-wrap;
  line-height: 1.45;
  font-size: 14px;
  word-break: break-word;
}

.copy {
  width: 100%;
  margin-top: 12px;
  padding: 11px;
  border: 1px solid #806b2d;
  border-radius: 10px;
  background: #1d1f20;
  color: #f5c542;
  font-weight: bold;
}

.copy:active {
  transform: scale(.98);
}

.footer {
  text-align: center;
  color: #666;
  font-size: 12px;
  padding: 20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login">
  <div class="login-box">
    <div class="logo">🪖</div>

    <h1>ACADEMIA MILITAR DE CHICO {LT}</h1>
    <h2>FUERZAS ARMADAS DEL SERVIDOR</h2>

    <input
      id="password"

      placeholder="Ingrese la clave de acceso"

    >

    <div id="error"></div>
  </div>
</section>


<!-- APP -->
<section id="app" class="hidden">

<header>
  <div class="header-title">
    <h1>🪖 ACADEMIA MILITAR DE CHICO {LT}</h1>

<div class="container">

    <br><br>
    Selecciona una macro y pulsa <b>COPIAR</b>.
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Buscar macro..."

  >

  <div class="footer">
    ACADEMIA MILITAR • FUERZAS ARMADAS DEL SERVIDOR

</section>

`/me ABANDONEN INMEDIATAMENTE LAS INMEDIACIONES DE LA BASE MILITAR CONFORME AL CRITERIO ADMINISTRATIVO VIGENTE, ESTA ES UNA ORDEN DIRECTA DEL PERSONAL MILITAR, SI SE NIEGAN A COOPERAR SERAN CATALOGADOS COMO AMENAZAS.`

/* =========================
   LOGIN
========================= */

function entrar() {

  const password =
    document.getElementById("password").value;

  if (password === CLAVE) {

    document.getElementById("login")
      .classList.add("hidden");

    document.getElementById("app")
      .classList.remove("hidden");

    mostrarMacros();

  } else {

    document.getElementById("error").textContent =
      "❌ CLAVE INCORRECTA";

  }
}


/* ENTER PARA INGRESAR */

document.getElementById("password")
.addEventListener("keydown", function(e) {

  if (e.key === "Enter") {
    entrar();
  }

});


/* =========================
   MOSTRAR MACROS
========================= */

function mostrarMacros(lista = macros) {

  const contenedor =
    document.getElementById("macros");

  contenedor.innerHTML = "";

  lista.forEach((macro, index) => {

    const numero =
      macros.indexOf(macro) + 1;

    const div =
      document.createElement("div");

    div.className = "macro";

    div.innerHTML = `
      <div class="macro-number">
        MACRO #${numero}
      </div>

      <div class="macro-text">
        ${escaparHTML(macro)}
      </div>

      <button class="copy"
        onclick="copiar(${numero - 1}, this)">
        📋 COPIAR
      </button>
    `;

    contenedor.appendChild(div);

  });
}


/* =========================
   BUSCADOR
========================= */

function buscar() {

  const texto =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  if (!texto) {

    mostrarMacros();

    return;

  }

  const resultados =
    macros.filter(macro =>
      macro.toLowerCase().includes(texto)
    );

  mostrarMacros(resultados);
}


/* =========================
   COPIAR
========================= */

function copiar(index, boton) {

  const texto = macros[index];

  navigator.clipboard.writeText(texto)
    .then(() => {

      const original =
        boton.innerHTML;

      boton.innerHTML =
        "✅ COPIADO";

      setTimeout(() => {
        boton.innerHTML = original;
      }, 1500);

    })
    .catch(() => {

      const area =
        document.createElement("textarea");

      area.value = texto;

      document.body.appendChild(area);

      area.select();

      document.execCommand("copy");

      area.remove();

      boton.innerHTML =
        "✅ COPIADO";

      setTimeout(() => {
        boton.innerHTML = "📋 COPIAR";
      }, 1500);

    });
}


/* =========================
   SEGURIDAD HTML
========================= */

function escaparHTML(texto) {

  return texto
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>
